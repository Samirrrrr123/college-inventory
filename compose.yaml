services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: inventory
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: postgresql://inventory:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/inventory
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://127.0.0.1:8080}
      ACCESS_SECRET: ${ACCESS_SECRET:?Set ACCESS_SECRET in .env}
      REFRESH_SECRET: ${REFRESH_SECRET:?Set REFRESH_SECRET in .env}
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
